name: Refresh Compendium
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Accept a deliberate sharp drop in tab rows (20%+) or a removed tab
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: compendium-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and parse all Compendium tabs
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPENDIUM_ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        run: node runner.mjs compendium.json
      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compendium-refresh-${{ steps.refresh.outputs.good == 'true' && 'good' || 'rejected' }}
          path: ${{ runner.temp }}/compendium-refresh/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit only changed content
        run: |
          git add compendium.json
          if git diff --cached --quiet; then
            echo "Compendium is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh styled Compendium data"
          git push origin HEAD:main
